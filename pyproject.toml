[project]
    authors = [{ name = "bwrob", email = "bartosz.marcin.wroblewski@gmail.com" }]
    classifiers = [
        "Development Status :: 3 - Alpha",
        "Intended Audience :: Developers",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.10",
        "Programming Language :: Python :: 3.11",
        "Programming Language :: Python :: 3.12",
        "Topic :: Software Development :: Debuggers",
        "Operating System :: OS Independent",
    ]
    dependencies = ["rich>=13.0.0", "textual>=8.0.0", "typing-extensions>=4.0.0", "tzdata; sys_platform == 'win32'"]
    description = "The interactive, terminal-based object inspector for suspicious Python objects."
    keywords = ["inspection", "tui", "textual", "rich", "debugging", "introspection"]
    license = "MIT"
    name = "sus-inspector"
    readme = "README.md"
    requires-python = ">=3.10"
    version = "0.2.0"

    [project.scripts]
        sus = "sus_inspector.main:main"

    [project.urls]
        Homepage   = "https://github.com/bwrob/sus-inspector"
        Issues     = "https://github.com/bwrob/sus-inspector/issues"
        Repository = "https://github.com/bwrob/sus-inspector.git"

[build-system]
    build-backend = "uv_build"
    requires      = ["uv_build>=0.11.2,<0.12.0"]

[dependency-groups]
    dev = [
        "attrs>=26.1.0",
        "basedpyright>=1.38.4",
        "hypothesis>=6.151.10",
        "mkdocs>=1.6.1",
        "mkdocs-material>=9.7.6",
        "mkdocstrings[python]>=1.0.3",
        "msgspec>=0.20.0",
        "poethepoet>=0.42.1",
        "pre-commit>=4.5.1",
        "pydantic>=2.12.5",
        "pytest>=9.0.2",
        "pytest-asyncio>=1.3.0",
        "pytest-cov>=7.1.0",
        "ruff>=0.15.8",
        "ty>=0.0.26",
]
