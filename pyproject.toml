[project]
name = "sus-inspector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bwrob", email = "bartosz.marcin.wroblewski@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "rich>=14.3.3",
    "textual>=8.2.0",
]

[project.scripts]
sus-inspector = "sus_inspector:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.38.4",
    "poethepoet>=0.42.1",
    "pre-commit>=4.5.1",
    "ruff>=0.15.8",
    "ty>=0.0.26",
]
